    let dps = 0;
    for (let j = 0; j < flames.length; j++) {
      const f = flames[j];
      const rr = f.r + e.r;
      if (dist2(f.x, f.y, e.x, e.y) < rr * rr && f.dps > dps) dps = f.dps;
    }
    if (dps > 0) {
      e.hp -= dps * dt;
      e.burn = 1.7;                 // keeps burning after leaving the flame
      e.flash = Math.max(e.flash, 0.03);
      if (e.hp <= 0) killEnemy(e, 0, 1);
    }
  }
  // burning crates and barrels
  for (let j = 0; j < flames.length; j++) {
    const f = flames[j];
    if (Math.random() > 0.25) continue;
    eachObstacle(f.x - f.r, f.y - f.r, f.x + f.r, f.y + f.r, function (o) {
      if (!o.hp || o.dead) return;
      damageObstacle(o, 14 * dt * 4, 0, 0);
    });
  }
}

function drawFlames() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < flames.length; i++) {
    const f = flames[i];
    const t = clamp(f.life / f.max, 0, 1);
    const r = f.r;
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
    if (t > 0.72) {
      g.addColorStop(0, 'rgba(255,255,225,' + (0.95 * t).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(255,214,90,' + (0.7 * t).toFixed(3) + ')');
    } else {
      g.addColorStop(0, 'rgba(255,196,80,' + (0.75 * t).toFixed(3) + ')');
      g.addColorStop(0.35, 'rgba(255,120,26,' + (0.55 * t).toFixed(3) + ')');
    }
    g.addColorStop(0.72, 'rgba(200,52,10,' + (0.30 * t).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(60,10,4,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(f.x, f.y, r, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawFlamePart(p, t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
  g.addColorStop(0, 'rgba(255,230,150,' + (0.8 * t).toFixed(3) + ')');
  g.addColorStop(0.5, 'rgba(255,120,30,' + (0.5 * t).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(80,16,4,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ------------------------------------------------------------------ pickups */
let healFlash = 0;
function spawnPickup(x, y, kind) {
  pickups.push({ x, y, kind, t: 0, life: kind === 'med' ? 30 : 45 });
}
function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.t += dt;
    p.life -= dt;
    if (p.life <= 0) { pickups.splice(i, 1); continue; }
    if (!player.dead && dist2(p.x, p.y, player.x, player.y) < 26 * 26) {
      if (p.kind === 'med') {
        if (player.hp >= player.maxHp) continue;    // leave it for when it is needed
        player.hp = Math.min(player.maxHp, player.hp + 35);
        healFlash = 0.6;
      } else {
        giveWeapon(p.kind);
      }
      for (let k = 0; k < 10; k++) {
        const a = rnd(0, TAU);
        spawnPart({ x: p.x, y: p.y, vx: Math.cos(a) * rnd(30, 90), vy: Math.sin(a) * rnd(30, 90), life: rnd(0.2, 0.45), r: 2, col: '#f0e08a' });
      }
      pickups.splice(i, 1);
    }
  }
}
function drawPickups() {
  for (let i = 0; i < pickups.length; i++) {
    const p = pickups[i];
    if (p.x < cam.x - 40 || p.x > cam.x + viewW() + 40 || p.y < cam.y - 40 || p.y > cam.y + viewH() + 40) continue;
    const bob = Math.sin(p.t * 4) * 2;
    const blink = p.life < 6 && Math.floor(p.life * 6) % 2 === 0;
    ctx.save();
    ctx.globalAlpha = blink ? 0.35 : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 8, 13, 6, 0, 0, TAU); ctx.fill();
    // glowing pad
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(p.x, p.y + bob, 0, p.x, p.y + bob, 22);
    const c = p.kind === 'flame' ? '255,130,40' : (p.kind === 'med' ? '120,255,150' : '120,210,255');
    g.addColorStop(0, 'rgba(' + c + ',0.5)');
    g.addColorStop(1, 'rgba(' + c + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y + bob, 22, 0, TAU); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.translate(p.x, p.y + bob);
    if (p.kind === 'med') {
      ctx.fillStyle = '#e8e4d8';
      roundRect(-9, -7, 18, 14, 2); ctx.fill();
      ctx.strokeStyle = 'rgba(20,20,16,0.7)'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = '#c02a22';
      ctx.fillRect(-5.5, -1.8, 11, 3.6);
      ctx.fillRect(-1.8, -5.5, 3.6, 11);
      ctx.restore();
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.rotate(-0.5);
    ctx.fillStyle = '#2a2a22';
    ctx.fillRect(-11, -3, 22, 6);
    if (p.kind === 'flame') {
      ctx.fillStyle = '#b8452a'; ctx.fillRect(4, -5.5, 7, 11);
      ctx.fillStyle = '#5a5448'; ctx.fillRect(-12, -7, 6, 14);
    } else {
      ctx.fillStyle = '#4a4a3a'; ctx.fillRect(-4, -4.5, 9, 9);
      ctx.fillStyle = '#8fd6ff'; ctx.fillRect(8, -2, 5, 4);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* ------------------------------------------------------------ level layout */
let levelSeed = 1;
function buildLevel() {
  const r = mulberry32(levelSeed);
  buildObstacles(r);
  buildEnemies(r);
}
function sandbag(x, y, len, vertical) {
  return addObstacle(vertical
    ? { kind: 'sandbag', x: x - 11, y: y - len / 2, w: 22, h: len, solid: true, blocks: true, chipCol: '#8a8058' }
    : { kind: 'sandbag', x: x - len / 2, y: y - 11, w: len, h: 22, solid: true, blocks: true, chipCol: '#8a8058' });
}
function crate(x, y, drop) {
  return addObstacle({
    kind: 'crate', x: x - 16, y: y - 16, w: 32, h: 32, solid: true, blocks: true,
    hp: 42, maxHp: 42, flash: 0, drop: drop, chipCol: '#a07a40'
  });
}
function barrel(x, y) {
  return addObstacle({
    kind: 'barrel', x: x - 13, y: y - 13, w: 26, h: 26, solid: true, blocks: true,
    hp: 22, maxHp: 22, flash: 0, chipCol: '#b05030'
  });
}
function vehicle(x, y, vertical) {
  return addObstacle(vertical
    ? { kind: 'vehicle', x: x - 28, y: y - 52, w: 56, h: 104, solid: true, blocks: true, chipCol: '#6a655a' }
    : { kind: 'vehicle', x: x - 52, y: y - 28, w: 104, h: 56, solid: true, blocks: true, chipCol: '#6a655a' });
}
function wallBlock(x, y, w, h) {
  return addObstacle({ kind: 'wall', x: x - w / 2, y: y - h / 2, w: w, h: h, solid: true, blocks: true, chipCol: '#9a9488' });
}

function buildObstacles(r) {
  obstacles = [];
  const safeY = WORLD.h - 300;   // keep the drop zone clear

  // scattered cover the length of the valley
  for (let y = WORLD.h - 460; y > 620; y -= 200) {
    const prog = 1 - y / WORLD.h;
    const n = 2 + Math.floor(r() * 3);
    for (let i = 0; i < n; i++) {
      const x = 90 + r() * (WORLD.w - 180);
      const yy = y + r() * 160 - 80;
      if (yy > safeY) continue;
      const t = r();
      if (t < 0.34) {
        sandbag(x, yy, 70 + r() * 90, r() < 0.35);
      } else if (t < 0.62) {
        crate(x, yy, r() < 0.5 ? 'spread' : 'flame');
      } else if (t < 0.76) {
        barrel(x, yy);
      } else if (t < 0.88 && prog > 0.12) {
        vehicle(x, yy, r() < 0.4);
      } else {
        // an entrenched firing position: an L of sandbags facing south
        const len = 80 + r() * 60;
        sandbag(x, yy, len, false);
        sandbag(x - len / 2, yy + 30, 60, true);
        if (r() < 0.5) crate(x + len / 2 + 20, yy + 10, r() < 0.5 ? 'spread' : 'flame');
      }
    }
  }

  // a couple of rubble ridges that force the player to pick a lane
  for (let k = 0; k < 6; k++) {
    const y = 1400 + k * 1250 + r() * 200;
    const gap = 260 + r() * 180;
    const gx = 250 + r() * (WORLD.w - 500);
    for (let x = 60; x < WORLD.w - 60; x += 120) {
      if (Math.abs(x - gx) < gap / 2) continue;
      if (r() < 0.26) continue;
      const t = r();
      const jy = y + (r() - 0.5) * 44;
      if (t < 0.16) sandbag(x + 30, jy, 90 + r() * 40, false);
      else if (t < 0.24) barrel(x + 30, jy);
      else wallBlock(x + 30, jy, 76 + r() * 48, 26 + r() * 16);
    }
  }

  buildFortress(r);
  buildObstacleGrid();
}

// The objective: the command post at the head of the valley.
const OBJ = { x: WORLD.w / 2, y: 250, r: 46 };

// The fortified position that caps the level.
function buildFortress(r) {
  const cy = 460;
  // command post: three walls, open to the south so it must be entered on foot
  wallBlock(OBJ.x - 78, OBJ.y + 6, 26, 128);
  wallBlock(OBJ.x + 78, OBJ.y + 6, 26, 128);
  wallBlock(OBJ.x, OBJ.y - 58, 182, 26);
  for (let x = 120; x < WORLD.w - 120; x += 150) {
    if (Math.abs(x - WORLD.w / 2) < 110) continue;    // gate
    sandbag(x + 20, cy + 120, 130, false);
  }
  wallBlock(WORLD.w / 2 - 190, cy, 150, 46);
  wallBlock(WORLD.w / 2 + 190, cy, 150, 46);
  // inner wall, broken by the gate that leads up to the command post
  wallBlock(OBJ.x - 200, cy - 120, 210, 50);
  wallBlock(OBJ.x + 200, cy - 120, 210, 50);
  sandbag(WORLD.w / 2 - 150, cy + 40, 90, true);
  sandbag(WORLD.w / 2 + 150, cy + 40, 90, true);
  vehicle(240, cy + 20, false);
  vehicle(WORLD.w - 240, cy + 20, false);
  barrel(WORLD.w / 2 - 60, cy - 40);
  barrel(WORLD.w / 2 + 60, cy - 40);
  crate(WORLD.w / 2 - 240, cy + 60, 'flame');
  crate(WORLD.w / 2 + 240, cy + 60, 'spread');
  for (let i = 0; i < 5; i++) {
    barrel(180 + r() * (WORLD.w - 360), cy + 200 + r() * 120);
  }
}

// find an open patch of ground near a band, so nobody spawns inside cover
function freeSpot(r, y, spread) {
  for (let k = 0; k < 24; k++) {
    const x = 110 + r() * (WORLD.w - 220);
    const yy = clamp(y + r() * spread - spread / 2, 60, WORLD.h - 60);
    if (!pointInSolid(x, yy, 16)) return { x: x, y: yy };
  }
  return null;
}

// a firing position dug in behind a piece of cover, facing south down the valley
function entrenchSpot(r, y, spread) {
  for (let k = 0; k < 30; k++) {
    const x = 110 + r() * (WORLD.w - 220);
    const yy = clamp(y + r() * spread - spread / 2, 80, WORLD.h - 80);
    let found = null;
    eachObstacle(x - 160, yy - 160, x + 160, yy + 160, function (o) {
      if (!o.blocks || o.kind === 'barrel' || o.kind === 'crate') return;
      const sy = o.cy - (o.hy + 20);
      const sx = o.cx + (r() - 0.5) * o.w * 0.6;
      if (pointInSolid(sx, sy, 14)) return;
      found = { x: sx, y: sy };
      return true;
    });
    if (found) return found;
  }
  return freeSpot(r, y, spread);
}

function buildEnemies(r) {
  // Bands of resistance running north. Density climbs as the player advances.
  const startY = WORLD.h - 520;
  for (let y = startY; y > 900; y -= 340) {
    const prog = 1 - (y / WORLD.h);          // 0 at the south edge, 1 at the north
    const n = Math.round(lerp(1, 4.5, prog) + r() * 1.6);
    for (let i = 0; i < n; i++) {
      const p = freeSpot(r, y, 250);
      if (p) spawnEnemy('grunt', p.x, p.y);
    }
    if (prog > 0.14 && r() < 0.25 + prog * 0.6) {
      const g = entrenchSpot(r, y, 250);
      if (g) { const e = spawnEnemy('gunner', g.x, g.y); e.home.x = g.x; e.home.y = g.y; }
    }
    if (prog > 0.34 && r() < (prog - 0.3) * 0.9) {
      const h = freeSpot(r, y, 250);
      if (h) spawnEnemy('heavy', h.x, h.y);
    }
  }
  buildGarrison(r);
}

// the fortified position at the top of the map
function buildGarrison(r) {
  const cy = 460;
  for (let i = 0; i < 9; i++) {
    const g = entrenchSpot(r, cy + 140, 220);
    if (g) { const e = spawnEnemy('gunner', g.x, g.y); e.home.x = g.x; e.home.y = g.y; }
  }
  for (let i = 0; i < 5; i++) {
    const h = freeSpot(r, cy + 40, 260);
    if (h) spawnEnemy('heavy', h.x, h.y);
  }
  for (let i = 0; i < 10; i++) {
    const p = freeSpot(r, cy + 260, 340);
    if (p) spawnEnemy('grunt', p.x, p.y);
  }
  for (let i = 0; i < 6; i++) {
    const p = freeSpot(r, 820, 260);
    if (p) spawnEnemy(r() < 0.35 ? 'gunner' : 'grunt', p.x, p.y);
  }
}

/* ---------------------------------------------------- reinforcement waves */
let frontier = 0, nextWaveY = 0, waveN = 0, campT = 0;

function updateLevel(dt) {
  if (noiseT > 0) noiseT -= dt;
  const gained = frontier - player.y;
  if (player.y < frontier) frontier = player.y;
  // digging in is not a strategy: sitting still calls down reinforcements
  if (gained > 1.5) campT = 0; else campT += dt;
  if (campT > 13) { campT = 0; if (nearbyEnemyCount() < 16) spawnWave(); }
  if (frontier < nextWaveY) {
    nextWaveY = frontier - 460;
    spawnWave();
  }
  // the objective is taken by standing on the command post
  if (!player.dead && dist(player.x, player.y, OBJ.x, OBJ.y) < OBJ.r) {
    state = ST.WIN;
    deathTimer = 0;
    addShake(6);
    for (let i = 0; i < 30; i++) {
      const a = rnd(0, TAU);
      spawnPart({ x: OBJ.x, y: OBJ.y, vx: Math.cos(a) * rnd(40, 220), vy: Math.sin(a) * rnd(40, 220), life: rnd(0.4, 1.1), r: rnd(2, 4), col: '#ffe08a' });
    }
  }
}

function nearbyEnemyCount() {
  let n = 0;
  for (let i = 0; i < enemies.length; i++) {
    if (dist2(enemies[i].x, enemies[i].y, player.x, player.y) < 1500 * 1500) n++;
  }
  return n;
}

function spawnWave() {
  waveN++;
  const prog = clamp(1 - player.y / WORLD.h, 0, 1);
  if (nearbyEnemyCount() > 18) return;
  const n = Math.round(2 + prog * 4 + rnd(0, 1.4));
  const aheadY = player.y - viewH() * 0.5 - rnd(90, 340);
  if (aheadY < 260) return;
  const r = Math.random;
  for (let i = 0; i < n; i++) {
    const t = Math.random();
    let kind = 'grunt';
    if (t < 0.16 + prog * 0.18) kind = 'gunner';
    if (t > 0.86 - prog * 0.12 && prog > 0.3) kind = 'heavy';
    const p = kind === 'gunner' ? entrenchSpot(r, aheadY, 320) : freeSpot(r, aheadY, 340);
    if (!p) continue;
    const e = spawnEnemy(kind, p.x, p.y);
    e.home.x = p.x; e.home.y = p.y;
    e.awake = true;
  }
}

function startGame() {
  levelSeed = (Math.random() * 1e9) | 0;   // a fresh valley every deployment
  resetCombat();
  resetPlayer();
  buildScenery();
  buildLevel();
  snapCamera();
  hurtFlash = 0; hudFlash = 0; deathTimer = 0;
  frontier = player.y; nextWaveY = player.y - 700; waveN = 0;
  campT = 0; noiseT = 0;
  state = ST.PLAY;
}

/* --------------------------------------------------------------- main loop */
let last = performance.now();
let dbgFps = 60;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;      // clamp so a tab-out never teleports anything
  time += dt;
  dbgFps = dbgFps * 0.92 + (1 / Math.max(dt, 0.0001)) * 0.08;

  if (state === ST.PLAY) {
    updatePlayer(dt);
    playerFire(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateGrenades(dt);
    updateFlames(dt);
    updateParts(dt);
    updateRings(dt);
    updatePickups(dt);
    updateObstacles(dt);
    updateLevel(dt);
    updateCamera(dt);
  } else if (state === ST.DEAD || state === ST.WIN) {
    deathTimer += dt;
    updateBullets(dt);
    updateGrenades(dt);
    updateFlames(dt);
    updateParts(dt);
    updateRings(dt);
    updateEnemies(dt);
    updateCamera(dt);
  }
  if (hitMark > 0) hitMark = Math.max(0, hitMark - dt);
  if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt * 2.8);
  if (hudFlash > 0) hudFlash = Math.max(0, hudFlash - dt);
  if (healFlash > 0) healFlash = Math.max(0, healFlash - dt);
  render();
  requestAnimationFrame(frame);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#191a12';
  ctx.fillRect(0, 0, VW, VH);

  ctx.save();
  ctx.scale(ZOOM, ZOOM);
  ctx.translate(-cam.x + cam.sx, -cam.y + cam.sy);
  const vx0 = cam.x - 40, vy0 = cam.y - 40, vx1 = cam.x + viewW() + 40, vy1 = cam.y + viewH() + 40;
  drawGround(vx0, vy0, vx1, vy1);
  drawDecals(vx0, vy0, vx1, vy1);
  drawObjective();
  drawPickups();
  drawObstaclesLow(vx0, vy0, vx1, vy1);
  drawEnemies();
  if (!player.dead) drawPlayer();
  if (player.muzzle > 0) drawMuzzleFlash(player);
  drawBullets();
  drawGrenades();
  drawObstaclesHigh(vx0, vy0, vx1, vy1);
  drawFlames();
  drawParts();
  drawRings();
  ctx.restore();

  drawOverlays();
  drawHUD();
  drawScreens();
  if (state === ST.PLAY) drawCrosshair();
}

buildGroundPattern();
startGame();
state = ST.TITLE;      // the live valley sits behind the title card
requestAnimationFrame(frame);
</script>
