<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOGS OF WAR</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0d0a;overflow:hidden;}
  body{font-family:"Courier New",Courier,monospace;color:#d8d4c0;}
  canvas{display:block;position:absolute;left:0;top:0;cursor:none;image-rendering:auto;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
(function(){

//=============================================================
// UTIL
//=============================================================
const TAU = Math.PI * 2;
const PI = Math.PI;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a + Math.random()*(b-a); }
function randi(a,b){ return Math.floor(a + Math.random()*(b-a)); }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function dist2(ax,ay,bx,by){ const dx=bx-ax, dy=by-ay; return dx*dx+dy*dy; }
function dist(ax,ay,bx,by){ return Math.hypot(bx-ax,by-ay); }
function angDiff(a,b){ let d=(b-a)%TAU; if(d>PI)d-=TAU; if(d<-PI)d+=TAU; return d; }
function approach(v,t,step){ if(v<t) return Math.min(t,v+step); return Math.max(t,v-step); }

function hash2(x,y){
  let n = Math.imul(x|0, 374761393) ^ Math.imul(y|0, 668265263);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16))>>>0) / 4294967296;
}
function makeRng(seed){
  let s = (seed>>>0) || 1;
  return function(){
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function darkenHex(hex, f){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n>>16)&255)*f), g = Math.round(((n>>8)&255)*f), b = Math.round((n&255)*f);
  return 'rgb('+r+','+g+','+b+')';
}
function darkenPal(pal, f){
  const o = {};
  for (const k in pal) o[k] = darkenHex(pal[k], f);
  return o;
}
function rgbLerp(c1,c2,t){
  const r = Math.round(lerp(c1[0],c2[0],t));
  const g = Math.round(lerp(c1[1],c2[1],t));
  const b = Math.round(lerp(c1[2],c2[2],t));
  return 'rgb('+r+','+g+','+b+')';
}

//=============================================================
// CANVAS / INPUT
//=============================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
let VW = 0, VH = 0;
function resize(){
  VW = cv.width = Math.max(320, window.innerWidth|0);
  VH = cv.height = Math.max(240, window.innerHeight|0);
  cv.style.width = VW+'px';
  cv.style.height = VH+'px';
}
window.addEventListener('resize', resize);
resize();

const keys = Object.create(null);
const mouse = { x: 0, y: 0, down:false, wx:0, wy:0 };
const BLOCKED_KEYS = { KeyW:1,KeyA:1,KeyS:1,KeyD:1,Space:1,ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1 };
window.addEventListener('keydown', function(e){
  keys[e.code] = true;
  if (BLOCKED_KEYS[e.code]) e.preventDefault();
  onKeyPress(e.code);
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });
window.addEventListener('blur', function(){ for (const k in keys) keys[k] = false; mouse.down = false; });
cv.addEventListener('mousemove', function(e){
  const r = cv.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
cv.addEventListener('mousedown', function(e){ if (e.button===0){ mouse.down = true; onClick(); } e.preventDefault(); });
window.addEventListener('mouseup', function(e){ if (e.button===0) mouse.down = false; });
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

//=============================================================
// WORLD CONSTANTS
//=============================================================
const WORLD = { w: 2400, h: 8000 };
const ROAD_X = WORLD.w * 0.5;
const ROAD_HALF = 140;
const ZOOM = 1.3;
function viewW(){ return VW / ZOOM; }
function viewH(){ return VH / ZOOM; }

const COL_GRASS_S = [62,80,44];
const COL_GRASS_N = [78,74,52];
const COL_DIRT    = [104,88,64];
const COL_MUD     = [86,72,52];

//=============================================================
// GAME STATE
//=============================================================
const S_TITLE = 0, S_PLAY = 1, S_DEAD = 2, S_WIN = 3;
let state = S_TITLE;
let stateTime = 0;

const cam = { x:0, y:0, shake:0, sx:0, sy:0 };

let player = null;
let bullets = [];      // player + enemy projectiles
let enemies = [];
let obstacles = [];
let pickups = [];
let particles = [];
let decals = [];
let flames = [];
let corpses = [];
let floaters = [];
let spawners = [];
let kills = 0;
let gameTime = 0;
let hitstop = 0;    // brief slow-motion on big impacts

//=============================================================
// PLAYER
//=============================================================
function makePlayer(){
  return {
    x: ROAD_X, y: WORLD.h - 220,
    vx:0, vy:0,
    r: 13,
    speed: 176,
    aim: -PI/2,
    face: -PI/2,
    hp: 100, maxhp: 100,
    walk: 0,
    moving:false,
    fireCd: 0,
    weapon: 'rifle',
    ammo: Infinity,
    hurtFlash: 0,
    invuln: 0,
    dead:false,
    recoil:0,
    burning:0,
    northMost: WORLD.h
  };
}

//=============================================================
// RESET / START
//=============================================================
function resetGame(){
  bullets.length = 0;
  enemies.length = 0;
  obstacles.length = 0;
  pickups.length = 0;
  particles.length = 0;
  decals.length = 0;
  flames.length = 0;
  corpses.length = 0;
  floaters.length = 0;
  spawners.length = 0;
  kills = 0;
  gameTime = 0;
  hitstop = 0;
  cam.shake = 0; cam.sx = 0; cam.sy = 0;
  player = makePlayer();
  buildWorld();
  updateCamera(1, true);
}

function startGame(){
  resetGame();
  state = S_PLAY;
  stateTime = 0;
}

function onKeyPress(code){
  if (code === 'Enter' || code === 'Space'){
    if (state === S_TITLE) startGame();
    else if ((state === S_DEAD || state === S_WIN) && stateTime > 0.9){
      resetGame();
      state = S_TITLE;
      stateTime = 0;
    }
  }
}
function onClick(){
  if (state === S_TITLE) startGame();
  else if ((state === S_DEAD || state === S_WIN) && stateTime > 0.9){
    resetGame();
    state = S_TITLE;
    stateTime = 0;
  }
}

//=============================================================
// WORLD BUILD (stage 3 fills this with cover)
//=============================================================
let obsIdSeq = 0;
function addObstacle(kind, x, y, hw, hh, extra){
  const o = {
    id: ++obsIdSeq, kind:kind, x:x, y:y, hw:hw, hh:hh,
    hp: Infinity, maxhp: Infinity, flash:0, destroyed:false,
    blocksMove:true, blocksBullets:true, a:0, drop:null
  };
  if (extra) for (const k in extra) o[k] = extra[k];
  obstacles.push(o);
  return o;
}
function spaceFree(x, y, hw, hh, pad){
  const p = pad === undefined ? 26 : pad;
  for (let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if (Math.abs(o.x-x) < o.hw+hw+p && Math.abs(o.y-y) < o.hh+hh+p) return false;
  }
  return true;
}
function tryAdd(kind, x, y, hw, hh, extra, pad){
  if (x-hw < 24 || x+hw > WORLD.w-24 || y-hh < 24 || y+hh > WORLD.h-24) return null;
  if (!spaceFree(x,y,hw,hh,pad)) return null;
  return addObstacle(kind, x, y, hw, hh, extra);
}
function addCrate(x,y,rng){
  return tryAdd('crate', x, y, 15, 15, {
    hp:46, maxhp:46, drop: (rng && rng() < 0.42) ? 'health' : pick(['spread','flame'])
  });
}
function addBarrel(x,y){
  return tryAdd('barrel', x, y, 12, 12, { hp:22, maxhp:22 });
}

function buildWorld(){
  const rng = makeRng(0xD06);
  obsIdSeq = 0;
  const startY = WORLD.h - 220;

  // --- scattered cover through the valley, denser to the north ---
  for (let y = WORLD.h - 420; y > 620; y -= 130 + rng()*130){
    const northT = 1 - y/WORLD.h;
    const count = 1 + Math.floor(rng()*2 + northT*2.2);
    for (let i=0;i<count;i++){
      const x = 90 + rng()*(WORLD.w-180);
      const r = rng();
      if (r < 0.30){
        // sandbag emplacement, sometimes an L
        const hw = 34 + rng()*40, hh = 15;
        const o = tryAdd('sandbag', x, y+rng()*60-30, hw, hh);
        if (o && rng() < 0.4) tryAdd('sandbag', o.x + (rng()<0.5?-1:1)*(hw+15), o.y - 34, 15, 34+rng()*20);
      } else if (r < 0.52){
        addCrate(x, y+rng()*50-25, rng);
        if (rng() < 0.45) addCrate(x + 34, y + rng()*40-20, rng);
      } else if (r < 0.64){
        addBarrel(x, y+rng()*40-20);
        if (rng() < 0.5) addBarrel(x+27, y+rng()*30-15);
      } else if (r < 0.80){
        tryAdd('rock', x, y+rng()*50-25, 16+rng()*12, 13+rng()*9);
      } else {
        tryAdd('wreck', x, y+rng()*50-25, 34+rng()*10, 20+rng()*6, { a: rng()*TAU });
      }
    }
  }

  // --- roadblocks: partial sandbag lines across the road every so often ---
  for (let y = WORLD.h - 1200; y > 900; y -= 900 + rng()*500){
    const gap = ROAD_X - ROAD_HALF + rng()*(ROAD_HALF*2 - 90);
    for (let x = ROAD_X - ROAD_HALF - 60; x < ROAD_X + ROAD_HALF + 60; x += 90){
      if (x > gap - 100 && x < gap + 100) continue;
      tryAdd('sandbag', x, y, 44, 15, null, 6);
    }
    if (rng() < 0.6) tryAdd('wreck', ROAD_X + (rng()<0.5?-1:1)*rand(60,130), y - 70, 36, 21, { a: rng()*TAU });
  }

  // --- the fortified position at the top of the map ---
  const fy = 420;
  for (let x = 120; x < WORLD.w-120; x += 96){
    // Leave two firing gaps, each two segments wide. One segment left a mouth so
    // narrow that the baffle sandbag in front of it sealed the line completely —
    // enemies pushed up against it and could never come through.
    const inGap = (Math.abs(x - (ROAD_X-190)) < 110) || (Math.abs(x - (ROAD_X+230)) < 110);
    if (inGap) continue;
    tryAdd('wall', x, fy, 48, 20, null, 2);
  }
  tryAdd('sandbag', ROAD_X-190, fy+70, 52, 16, null, 4);
  tryAdd('sandbag', ROAD_X+230, fy+70, 52, 16, null, 4);
  for (let i=0;i<7;i++){
    tryAdd('sandbag', 150 + rng()*(WORLD.w-300), fy + 110 + rng()*150, 30+rng()*28, 15, null, 12);
  }
  for (let i=0;i<5;i++) addCrate(160 + rng()*(WORLD.w-320), 180 + rng()*160, rng);
  for (let i=0;i<4;i++) addBarrel(170 + rng()*(WORLD.w-340), 170 + rng()*180);
  tryAdd('wreck', ROAD_X-260, 250, 40, 24, { a: 0.4 });
  tryAdd('wreck', ROAD_X+280, 300, 40, 24, { a: -0.7 });
  // command bunker: the head of the valley
  tryAdd('bunker', ROAD_X, 175, 96, 46, null, 2);
  tryAdd('sandbag', ROAD_X-118, 245, 34, 15, null, 4);
  tryAdd('sandbag', ROAD_X+118, 245, 34, 15, null, 4);

  // keep the landing zone clear
  for (let i=obstacles.length-1;i>=0;i--){
    if (dist(obstacles[i].x, obstacles[i].y, ROAD_X, startY) < 190) obstacles.splice(i,1);
  }
  indexObstacles();

  buildEnemyPlan(rng);
}

let garrisonSpawned = false;
let objectiveY = 430;

function buildEnemyPlan(rng){
  spawners.length = 0;
  garrisonSpawned = false;
  // picket line: a couple of grunts visible right at the start
  spawners.push({ y: WORLD.h-620, trigger: WORLD.h, grunts:2, gunners:0, heavies:0, done:false });
  for (let y = WORLD.h - 1000; y > 620; y -= 330 + rng()*170){
    const northT = clamp(1 - y/WORLD.h, 0, 1);
    const grunts  = 1 + Math.round(rng()*1.5 + northT*2.8);
    const gunners = (northT > 0.30 && rng() < 0.25 + northT*0.55) ? (1 + (rng() < northT*0.55 ? 1 : 0)) : 0;
    const heavies = (northT > 0.48 && rng() < (northT-0.42)*1.5) ? 1 : 0;
    spawners.push({ y:y, trigger: y + 760, grunts:grunts, gunners:gunners, heavies:heavies, done:false });
  }
  // the fortified position
  spawners.push({ y: 470, trigger: 1500, grunts:5, gunners:4, heavies:2, done:false, garrison:true });
}

function freeSpot(x, y, r, tries){
  for (let i=0;i<(tries||14);i++){
    const px = clamp(x + rand(-90,90)*(i*0.12+1), 60, WORLD.w-60);
    const py = clamp(y + rand(-70,70)*(i*0.12+1), 60, WORLD.h-60);
    if (!overlapsObstacle(px, py, r+3, false)) return { x:px, y:py };
  }
  return null;
}

const _nearObs = [];
function obstaclesNear(x, y, rad, out){
  out.length = 0;
  const b0 = Math.floor((y-rad)/OBS_BAND), b1 = Math.floor((y+rad)/OBS_BAND);
  for (let k=b0;k<=b1;k++){
    const arr = obsBands[k];
    if (!arr) continue;
    for (let i=0;i<arr.length;i++){
      const o = arr[i];
      if (o.destroyed || !o.blocksBullets) continue;
      if (Math.abs(o.x-x) < rad+o.hw && Math.abs(o.y-y) < rad+o.hh) out.push(o);
    }
  }
  return out;
}

// place a gunner at the flank of a nearby piece of cover
function spawnGunnerNearCover(x, y){
  const arr = obstaclesNear(x, y, 260, _nearObs);
  let best = null, bestD = 1e9;
  for (let i=0;i<arr.length;i++){
    const o = arr[i];
    if (Math.max(o.hw,o.hh) < 14) continue;
    if (o.claimed) continue;
    const d = dist(o.x,o.y,x,y);
    if (d < bestD){ bestD = d; best = o; }
  }
  if (best){
    best.claimed = true;
    const side = Math.random() < 0.5 ? -1 : 1;
    const px = best.x + (best.hw + 20) * side;
    const py = best.y + best.hh + 16;
    if (!overlapsObstacle(px, py, 15, false)){
      const e = spawnEnemy('gunner', px, py);
      e.homeX = px; e.homeY = py; e.coverObs = best; e.fixedCover = true;
      return e;
    }
  }
  const s = freeSpot(x, y, 15);
  if (!s) return null;
  const e = spawnEnemy('gunner', s.x, s.y);
  e.homeX = s.x; e.homeY = s.y;
  return e;
}

function spawnSquad(s){
  const spreadX = s.garrison ? WORLD.w*0.36 : 380;
  for (let i=0;i<s.grunts;i++){
    const sp = freeSpot(ROAD_X + rand(-spreadX, spreadX), s.y + rand(-110,110), 13);
    if (sp) spawnEnemy('grunt', sp.x, sp.y);
  }
  for (let i=0;i<s.gunners;i++){
    spawnGunnerNearCover(ROAD_X + rand(-spreadX, spreadX), s.y + rand(-90,90));
  }
  for (let i=0;i<s.heavies;i++){
    const sp = freeSpot(ROAD_X + rand(-spreadX*0.7, spreadX*0.7), s.y + rand(-80,80), 17);
    if (sp) spawnEnemy('heavy', sp.x, sp.y);
  }
  if (s.garrison) garrisonSpawned = true;
}

function updateSpawners(dt){
  for (let i=0;i<spawners.length;i++){
    const s = spawners[i];
    if (s.done) continue;
    if (player.y < s.trigger){
      if (enemies.length > 26 && !s.garrison) continue;
      spawnSquad(s);
      s.done = true;
    }
  }
  // Forget stragglers: men left far to the south, and men who have spent a long
  // time behind the player unable to get a single shot off. The second case is
  // terrain wedging them; without this one of them can hold the level open.
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    const wedged = (e.dryT || 0) > 25 && e.y > player.y + 300 &&
                   dist2(e.x, e.y, player.x, player.y) > 600*600;
    if (e.y > player.y + 1500 || wedged){
      if (e.coverObs && e.coverObs.claimedBy === e) e.coverObs.claimedBy = null;
      enemies.splice(i,1);
    }
  }
  // victory: garrison wiped out at the fortified position
  if (garrisonSpawned && enemies.length === 0 && player.y < 900 && state === S_PLAY){
    state = S_WIN;
    stateTime = 0;
  }
}

//=============================================================
// MOVEMENT
//=============================================================
function moveEntity(e, dx, dy){
  e.x += dx; e.y += dy;
  collideObstacles(e);
  e.x = clamp(e.x, e.r, WORLD.w - e.r);
  e.y = clamp(e.y, e.r, WORLD.h - e.r);
}

function updatePlayer(dt){
  const p = player;
  let ix = 0, iy = 0;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy -= 1;
  if (keys.KeyS || keys.ArrowDown) iy += 1;
  if (ix && iy){ const inv = Math.SQRT1_2; ix *= inv; iy *= inv; }

  p.moving = (ix !== 0 || iy !== 0);
  const sp = p.speed;
  moveEntity(p, ix*sp*dt, iy*sp*dt);

  if (p.moving){
    p.walk += dt * 9;
    p.face = Math.atan2(iy, ix);
    p.stepT = (p.stepT || 0) + dt;
    if (p.stepT > 0.26){
      p.stepT = 0;
      smokePuff(p.x - ix*10 + rand(-3,3), p.y - iy*10 + rand(-3,3), rand(-8,8), rand(-8,8), rand(2.5,4.5), rand(0.28,0.5), '120,110,86');
    }
  } else {
    p.walk += dt * 2;
  }
  if (p.dmgDirs){
    for (let i=p.dmgDirs.length-1;i>=0;i--){
      p.dmgDirs[i].life -= dt;
      if (p.dmgDirs[i].life <= 0) p.dmgDirs.splice(i,1);
    }
  }

  // aim
  mouse.wx = mouse.x / ZOOM + cam.x;
  mouse.wy = mouse.y / ZOOM + cam.y;
  p.aim = Math.atan2(mouse.wy - p.y, mouse.wx - p.x);

  p.recoil = Math.max(0, p.recoil - dt*26);
  p.hurtFlash = Math.max(0, p.hurtFlash - dt*4);
  p.invuln = Math.max(0, p.invuln - dt);
  // standing in your own fuel fire hurts, so the flamer has to be aimed
  if (p.burning > 0){
    p.burning -= dt;
    p.burnTick = (p.burnTick || 0) - dt;
    if (p.burnTick <= 0){
      p.burnTick = 0.30;
      p.hp -= 4;
      addParticle({ kind:'fire', x:p.x+rand(-7,7), y:p.y+rand(-7,7), vx:rand(-12,12), vy:rand(-26,-6),
        life:rand(0.2,0.45), max:0.45, size:rand(3,6), drag:1.5 });
      p.hurtFlash = Math.max(p.hurtFlash, 0.35);
      if (p.hp <= 0){ p.hp = 0; playerDie(); return; }
    }
  }
  if (p.y < p.northMost) p.northMost = p.y;
}

//=============================================================
// CAMERA
//=============================================================
function updateCamera(dt, snap){
  const p = player;
  const vw = viewW(), vh = viewH();
  // look slightly toward the cursor
  let tx = p.x - vw*0.5;
  let ty = p.y - vh*0.5 - 42;   // lead the view north, the way the push goes
  const lookX = clamp((mouse.x - VW*0.5) / ZOOM * 0.22, -90, 90);
  const lookY = clamp((mouse.y - VH*0.5) / ZOOM * 0.22, -70, 70);
  tx += lookX; ty += lookY;
  tx = clamp(tx, 0, Math.max(0, WORLD.w - vw));
  ty = clamp(ty, 0, Math.max(0, WORLD.h - vh));
  if (snap){ cam.x = tx; cam.y = ty; }
  else {
    const k = 1 - Math.pow(0.0009, dt);
    cam.x += (tx - cam.x) * k;
    cam.y += (ty - cam.y) * k;
  }
  cam.shake = Math.max(0, cam.shake - dt * 22);
  const s = cam.shake;
  cam.sx = (Math.random()*2-1) * s;
  cam.sy = (Math.random()*2-1) * s;
}
function addShake(v){ cam.shake = Math.min(26, cam.shake + v); }

//=============================================================
// RENDER : GROUND
//=============================================================
function drawGround(){
  const cs = 64;
  const vw = viewW(), vh = viewH();
  const x0 = Math.floor(cam.x/cs)-1, x1 = Math.floor((cam.x+vw)/cs)+1;
  const y0 = Math.floor(cam.y/cs)-1, y1 = Math.floor((cam.y+vh)/cs)+1;
  for (let cy=y0; cy<=y1; cy++){
    const wy = cy*cs;
    const northT = clamp(1 - wy/WORLD.h, 0, 1);
    for (let cx=x0; cx<=x1; cx++){
      const wx = cx*cs;
      const h = hash2(cx,cy);
      const onRoad = Math.abs(wx + cs*0.5 - ROAD_X) < ROAD_HALF;
      let col;
      if (onRoad){
        col = rgbLerp(COL_DIRT, COL_MUD, h*0.30 + northT*0.30);
      } else {
        col = rgbLerp(COL_GRASS_S, COL_GRASS_N, clamp(northT*1.05 + (h-0.5)*0.18, 0, 1));
      }
      ctx.fillStyle = col;
      ctx.fillRect(wx, wy, cs+1, cs+1);
    }
  }
  // detail pass
  for (let cy=y0; cy<=y1; cy++){
    for (let cx=x0; cx<=x1; cx++){
      const wx = cx*cs, wy = cy*cs;
      const northT = clamp(1 - wy/WORLD.h, 0, 1);
      const h = hash2(cx,cy);
      const h2 = hash2(cx+7771, cy-3312);
      const h3 = hash2(cx-991, cy+4409);
      const onRoad = Math.abs(wx + cs*0.5 - ROAD_X) < ROAD_HALF;
      if (onRoad){
        if (h > 0.72){
          ctx.fillStyle = 'rgba(60,48,34,0.35)';
          ctx.beginPath();
          ctx.ellipse(wx + h2*cs, wy + h3*cs, 8+h*14, 5+h2*7, h3*3, 0, TAU);
          ctx.fill();
        }
        if (h2 > 0.86){
          ctx.fillStyle = 'rgba(150,138,110,0.35)';
          ctx.fillRect(wx + h3*cs, wy + h*cs, 3+h*3, 2+h2*2);
        }
      } else {
        if (h > 0.55){
          // grass tufts
          ctx.strokeStyle = northT>0.55 ? 'rgba(120,112,72,0.5)' : 'rgba(96,124,60,0.55)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i=0;i<3;i++){
            const gx = wx + ((h2*7919 + i*311) % 64);
            const gy = wy + ((h3*6577 + i*547) % 64);
            ctx.moveTo(gx, gy);
            ctx.lineTo(gx + (i-1)*2.4, gy - 5 - (i%2)*3);
          }
          ctx.stroke();
        }
        if (h3 > 0.9){
          ctx.fillStyle = 'rgba(78,72,58,0.55)';
          ctx.beginPath();
          ctx.arc(wx + h*cs, wy + h2*cs, 3 + h3*4, 0, TAU);
          ctx.fill();
        }
        if (h2 > 0.93){
          ctx.fillStyle = 'rgba(40,44,28,0.28)';
          ctx.beginPath();
          ctx.ellipse(wx + h3*cs, wy + h*cs, 16+h*16, 11+h2*10, h*3, 0, TAU);
          ctx.fill();
        }
      }
    }
  }
  // wheel ruts down the road
  ctx.fillStyle = 'rgba(56,46,30,0.22)';
  ctx.fillRect(ROAD_X-64, cam.y-10, 26, vh+20);
  ctx.fillRect(ROAD_X+40, cam.y-10, 26, vh+20);
  // road edges
  ctx.fillStyle = 'rgba(48,42,28,0.35)';
  ctx.fillRect(ROAD_X-ROAD_HALF-3, cam.y-10, 6, vh+20);
  ctx.fillRect(ROAD_X+ROAD_HALF-3, cam.y-10, 6, vh+20);
}

// RENDER : SOLDIER BODY (shared by player + enemies)
//=============================================================
function drawSoldier(x, y, faceAng, walkAng, walk, moving, pal, scale, flash){
  const s = scale || 1;
  ctx.save();
  ctx.translate(x, y);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(3*s, 4*s, 13*s, 10*s, 0, 0, TAU);
  ctx.fill();

  // legs oriented to movement
  const bob = moving ? Math.sin(walk)*3.6*s : 0;
  ctx.save();
  ctx.rotate(walkAng);
  ctx.fillStyle = flash ? '#ffffff' : pal.legs;
  roundRect(-6*s, -8*s + bob, 14*s, 6.5*s, 3*s);
  roundRect(-6*s, 1.5*s - bob, 14*s, 6.5*s, 3*s);
  ctx.fillStyle = flash ? '#ffffff' : '#20241a';
  roundRect(5*s, -8*s + bob, 4*s, 6.5*s, 2*s);
  roundRect(5*s, 1.5*s - bob, 4*s, 6.5*s, 2*s);
  ctx.restore();

  // torso oriented to facing
  ctx.save();
  ctx.rotate(faceAng);
  // arms first (under torso edge)
  ctx.fillStyle = flash ? '#ffffff' : pal.arm;
  roundRect(-1*s, -12.5*s, 12*s, 5.6*s, 2.6*s);
  roundRect(-1*s, 6.9*s, 12*s, 5.6*s, 2.6*s);
  ctx.fillStyle = flash ? '#ffffff' : pal.body;
  roundRect(-10*s, -9.5*s, 21*s, 19*s, 7*s);
  ctx.strokeStyle = 'rgba(12,14,10,0.55)';
  ctx.lineWidth = 1.4*s;
  strokeRoundRect(-10*s, -9.5*s, 21*s, 19*s, 7*s);
  // webbing
  ctx.fillStyle = flash ? '#ffffff' : pal.strap;
  ctx.fillRect(-6.5*s, -9*s, 3.6*s, 18*s);
  ctx.fillStyle = flash ? '#ffffff' : pal.pack || pal.strap;
  roundRect(-11*s, -6*s, 6*s, 12*s, 2.4*s);
  ctx.restore();
  ctx.restore();
}
function drawHead(x, y, faceAng, pal, scale, flash){
  const s = scale || 1;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(faceAng);
  ctx.fillStyle = flash ? '#ffffff' : pal.helmet;
  ctx.beginPath();
  ctx.arc(0,0, 7.2*s, 0, TAU);
  ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : pal.helmetDark;
  ctx.beginPath();
  ctx.arc(0,0, 7.2*s, PI*0.6, PI*1.4);
  ctx.fill();
  // brim toward facing
  ctx.fillStyle = flash ? '#ffffff' : pal.helmetDark;
  roundRect(4.2*s, -5*s, 4.2*s, 10*s, 2*s);
  ctx.strokeStyle = 'rgba(12,14,10,0.6)';
  ctx.lineWidth = 1.3*s;
  ctx.beginPath(); ctx.arc(0,0, 7.2*s, 0, TAU); ctx.stroke();
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  const rr = Math.min(r, w*0.5, h*0.5);
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.arcTo(x+w, y, x+w, y+h, rr);
  ctx.arcTo(x+w, y+h, x, y+h, rr);
  ctx.arcTo(x, y+h, x, y, rr);
  ctx.arcTo(x, y, x+w, y, rr);
  ctx.closePath();
  ctx.fill();
}
function strokeRoundRect(x,y,w,h,r){
  const rr = Math.min(r, w*0.5, h*0.5);
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.arcTo(x+w, y, x+w, y+h, rr);
  ctx.arcTo(x+w, y+h, x, y+h, rr);
  ctx.arcTo(x, y+h, x, y, rr);
  ctx.arcTo(x, y, x+w, y, rr);
  ctx.closePath();
  ctx.stroke();
}

const PAL_PLAYER = {
  legs:'#41502e', body:'#5d7539', strap:'#2b2820', arm:'#516434',
  helmet:'#758c46', helmetDark:'#4e6130', pack:'#6b5a34'
};

function drawPlayer(){
  const p = player;
  const flash = p.hurtFlash > 0 && ((p.hurtFlash*20)|0) % 2 === 0;
  const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, 24);
  g.addColorStop(0, 'rgba(190,230,120,0.30)');
  g.addColorStop(1, 'rgba(190,230,120,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, 24, 0, TAU); ctx.fill();
  drawSoldier(p.x, p.y, p.aim, p.moving ? p.face : p.aim, p.walk, p.moving, PAL_PLAYER, 1, flash);
  drawWeapon(p.x, p.y, p.aim, p.weapon, p.recoil);
  drawHead(p.x, p.y, p.aim, PAL_PLAYER, 1, flash);
}

function drawWeapon(x, y, ang, kind, recoil){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  const rb = (recoil||0);
  ctx.translate(-rb, 0);
  ctx.fillStyle = '#22242a';
  if (kind === 'spread'){
    roundRect(4, -3.5, 24, 7, 2);
    ctx.fillStyle = '#3a3d45';
    ctx.fillRect(20, -5, 8, 10);
    ctx.fillStyle = '#6b4a22';
    roundRect(0, -3, 8, 6, 2);
  } else if (kind === 'flame'){
    ctx.fillStyle = '#2a2d33';
    roundRect(3, -4, 20, 8, 2);
    ctx.fillStyle = '#8a2f22';
    ctx.beginPath(); ctx.arc(-1, 0, 5.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#4a4d55';
    roundRect(21, -3, 8, 6, 2);
  } else {
    roundRect(2, -2.6, 28, 5.2, 1.6);
    ctx.fillStyle = '#5a4326';
    roundRect(-2, -3, 10, 6, 2);
    ctx.fillStyle = '#3a3d45';
    ctx.fillRect(16, -4, 4, 8);
  }
  ctx.restore();
}
